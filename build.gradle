plugins {
  id("java-library")
  id("maven-publish")
}

group = "tech.maze"

ext {
  protovalidateVersion    = "1.2.2"
  grpcVersion             = "1.83.1"
  protobufJavaVersion     = "4.35.1"
  javaxAnnotationVersion  = "1.3.2"
}

repositories {
  mavenLocal()
  mavenCentral()
  gradlePluginPortal()
}

dependencies {
  implementation "io.grpc:grpc-stub:$grpcVersion"
  implementation "io.grpc:grpc-protobuf:$grpcVersion"
  implementation "javax.annotation:javax.annotation-api:$javaxAnnotationVersion"
  implementation "com.google.protobuf:protobuf-java:$protobufJavaVersion"
  implementation "build.buf:protovalidate:$protovalidateVersion"
}

sourceSets {
  main {
    java.srcDir "$buildDir/generated/source"
    java.srcDir "$buildDir/smithy/resolved/maze-event-types"
  }
}

jar {
  enabled = true
  archiveClassifier = ""

  manifest {
    attributes(
      'Implementation-Title': project.name,
      'Implementation-Version': project.version,
    )
  }
}

java {
  withSourcesJar()
}

publishing {
  publications {
    maven(MavenPublication) {
      from components.java
    }
  }

  repositories {
    maven {
      name = "gitlab"
      url = System.getenv("GITLAB_MAVEN_URL") ?: "https://scm.maze.trading/api/v4/groups/6/-/packages/maven"

      credentials {
        username = System.getenv("GITLAB_MAVEN_USER") ?: "gitlab-ci-token"
        password = System.getenv("CI_JOB_TOKEN") ?: System.getenv("GITLAB_MAVEN_PASSWORD") ?: System.getenv("GITLAB_TOKEN")
      }
    }
  }
}

tasks.register("printCoordinates") {
  doLast {
    println("group=${project.group}")
    println("artifactId=${project.name}")
  }
}
